<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css" spellcheck="false">
</head>
<body>

<div class="card">
    <div class="search">
        <input type="text" placeholder="enter city name " aria-label="city">
        <button type="button"><img src="search.png" alt="search"></button>
    </div>

    <div class="weather">
        <img src="rain.png" class="weather-icon" alt="weather icon">
        <h1 class="temp">33°C</h1>
        <h2 class="city">new york</h2>

        <div class="details">
            <div class="col">
                <img src="humidity.png" alt="humidity icon">
            </div>
            <div>
                <p class="humidity">50%</p>
                <p>humidity</p>
            </div>

            <div class="col">
                <img src="wind.png" alt="wind icon">
            </div>
            <div>
                <p class="wind">50%</p>
                <p>wind speed</p>
            </div>
        </div>
    </div>
</div>

<script>
    const apiKey = "8fa895c8b60341de0b4708e45f2ac3b3";
    const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

    const searchBox = document.querySelector(".search input");
    const searchBtn = document.querySelector(".search button");

    async function checkWeather(city) {
        try {
            const response = await fetch(`${apiUrl}${encodeURIComponent(city)}&appid=${apiKey}`);

            // handle HTTP errors
            if (!response.ok) {
                // try to read message from response body
                let errMsg = 'Unable to fetch weather';
                try {
                    const errData = await response.json();
                    if (errData && errData.message) errMsg = errData.message;
                } catch (e) {
                    // ignore JSON parse errors
                }
                alert(errMsg);
                return;
            }

            const data = await response.json();
            console.log(data);

            // guard against missing data
            if (!data || !data.main || !data.wind) {
                alert('Weather data is unavailable for this city.');
                return;
            }

            document.querySelector(".city").textContent = data.name;
            document.querySelector(".temp").textContent = Math.round(data.main.temp) + "°C";
            document.querySelector(".humidity").textContent = data.main.humidity + "%";
            // OpenWeatherMap returns wind speed in m/s — convert to km/h
            const windKmh = (data.wind.speed * 3.6).toFixed(1);
            document.querySelector(".wind").textContent = windKmh + " km/h";
        } catch (error) {
            console.error(error);
            alert('An error occurred while fetching weather.');
        }
    }

    searchBtn.addEventListener("click", () => {
        const city = searchBox.value.trim();
        if (city !== "") {
            checkWeather(city);
        }
    });

    // allow pressing Enter in the input to search
    searchBox.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') {
            const city = searchBox.value.trim();
            if (city !== "") checkWeather(city);
        }
    });
</script>

</body>
</html>
